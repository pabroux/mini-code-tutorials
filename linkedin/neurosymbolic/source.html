<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Nanum+Pen+Script&display=block" rel="stylesheet">
<style>
/* Concept palette: paper, ink, orange = neural */
:root{--paper:#F4EFE4;--ink:#1B2433;--accent:#E8622C;--pen:#2546A8;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;background:var(--paper);overflow:hidden}
body{color:var(--ink);position:relative;padding:70px 72px 0;font-family:Inter,sans-serif;text-align:center}
h1{font:900 84px/1.05 "Inter Display",Inter,sans-serif;letter-spacing:-.05em}
h1 .a{color:var(--accent)}
.step{margin:0 auto;display:flex;align-items:center;justify-content:center}
.paper{margin-top:56px;width:560px;height:200px;background:#FFFEFA;transform:rotate(-2deg);box-shadow:0 12px 26px rgba(27,36,51,.16);
  font:400 170px/200px "Nanum Pen Script",cursive;color:var(--pen);letter-spacing:.04em}
.paper span{display:inline-block}
.arrow{position:relative;height:150px;width:100%}
.arrow::before{content:"";position:absolute;left:50%;top:18px;bottom:28px;border-left:5px solid var(--c)}
.arrow::after{content:"";position:absolute;left:calc(50% - 13px);bottom:18px;border:14px solid transparent;border-top:18px solid var(--c);border-bottom:0}
.label{position:absolute;left:calc(50% + 34px);top:46px;text-align:left;font:800 30px "JetBrains Mono",monospace;color:var(--c);letter-spacing:.02em}
.label small{display:block;font:600 21px "JetBrains Mono",monospace;color:rgba(27,36,51,.6);margin-top:4px}
.clean{width:420px;height:130px;border:4px solid var(--ink);background:#fff;font:800 92px/122px "JetBrains Mono",monospace}
.result{font:900 210px/1 "Inter Display",Inter,sans-serif;letter-spacing:-.04em}
.foot{position:absolute;left:72px;right:72px;bottom:54px;display:flex;justify-content:space-between;font:600 18px "JetBrains Mono",monospace;color:rgba(27,36,51,.6);border-top:2px solid var(--ink);padding-top:12px}
</style></head><body>
<h1>One <span class="a">reads.</span><br>One reasons.</h1>

<div class="step paper"><span style="transform:rotate(-6deg)">3</span>&nbsp;<span style="transform:rotate(4deg) translateY(6px)">+</span>&nbsp;<span style="transform:rotate(-3deg)">5</span></div>

<div class="arrow" style="--c:#E8622C"><div class="label">NEURAL<small>reads the scribble</small></div></div>

<div class="step clean">3 + 5</div>

<div class="arrow" style="--c:#1B2433"><div class="label">SYMBOLIC<small>computes it, exactly</small></div></div>

<div class="step result">8</div>

<div class="foot"><span>neuro-symbolic AI</span><span>AI basics</span></div>
</body></html>
